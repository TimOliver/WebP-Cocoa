name: Build and release libwebp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, exactly matching toolchain.json (for example 1.6.0)'
        required: true
        type: string
      publish:
        description: 'Publish the draft after downloaded release assets pass consumer tests'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: libwebp-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.7'
      - name: Validate the requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open("toolchain.json"))
          version = lock["libwebp"]["version"]
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert os.environ["REQUESTED_VERSION"] == version, "Update the source/toolchain lock before releasing a different version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Install the pinned CMake and Ninja binaries
        run: bash scripts/bootstrap-tools.sh
      - name: Unit tests for build and distribution contracts
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build every Apple slice
        run: ./build.sh all
      - name: Test module imports, static linking, decoding, demux and SwiftPM
        run: python3 scripts/test-artifacts.py
      - name: Package complete release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/distribution.py package --tag "$VERSION" --repository "$GITHUB_REPOSITORY"
          python3 scripts/distribution.py verify --directory dist/release --tag "$VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Retain tested release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain build logs and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics
          path: |
            build/logs/
            dist/build-info.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-candidate
          path: dist/release
      - name: Verify the transferred release bytes
        run: python3 scripts/distribution.py verify --directory dist/release --tag "$VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Create the release manifest commit and candidate tag
        run: |
          # A public SemVer tag would be selected by SwiftPM even while its
          # release assets are private. Stage under a non-SemVer tag instead.
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Release tag $VERSION already exists; refusing to replace it" >&2
            exit 1
          fi
          git switch --detach "$GITHUB_SHA"
          cp dist/release/Package.swift Package.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Package.swift
          git commit -m "Release libwebp $VERSION binary package"
          CANDIDATE_TAG="candidate-$VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          git tag -a "$CANDIDATE_TAG" -m "Candidate for libwebp $VERSION"
          git push origin "refs/tags/$CANDIDATE_TAG"
          echo "CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
      - name: Upload a draft GitHub Release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Static libwebp XCFrameworks for macOS, iOS, Mac Catalyst, tvOS, watchOS and visionOS.

          Use the WebPImageIO SwiftPM product for decoder + demux, or WebPFull for encoding, decoding and mux/demux. The four individual products remain available. WebP and WebPDecoder contain overlapping decoder symbols and must not be linked together.

          Each XCFramework includes upstream licenses. SHA256SUMS covers the binary archives, generated SwiftPM manifest and build provenance. See the README at this tag for supported architectures and minimum OS versions.
          NOTES
          gh release create "$CANDIDATE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "libwebp $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Test the assets downloaded from the draft release
        run: |
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/downloaded-release"
          python3 scripts/distribution.py verify --directory "$RUNNER_TEMP/downloaded-release" \
            --tag "$VERSION" --repository "$GITHUB_REPOSITORY" --extract-to "$RUNNER_TEMP/release-consumer"
          python3 scripts/test-artifacts.py --dist "$RUNNER_TEMP/release-consumer/dist" --package "$RUNNER_TEMP/release-consumer"
      - name: Record the tested draft for later promotion
        run: |
          {
            echo "Tested draft: $CANDIDATE_TAG"
            echo "Release manifest commit: $RELEASE_COMMIT"
            echo 'Promote this draft by changing its tag to the release version and its target to this exact commit; see the README. Publishing the candidate tag unchanged will not make its SwiftPM URLs usable.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the tested draft
        if: inputs.publish
        run: |
          REMOTE_VERSION="$(git ls-remote --tags origin "refs/tags/$VERSION")"
          if [[ -n "$REMOTE_VERSION" ]]; then
            echo "Release tag $VERSION already exists; refusing to replace it" >&2
            exit 1
          fi
          # GitHub creates the final tag at the exact commit when publishing.
          # Keep the candidate tag as provenance; never rewrite a source branch.
          gh release edit "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --tag "$VERSION" --target "$RELEASE_COMMIT" --draft=false
          git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
          test "$(git rev-parse "$VERSION^{commit}")" = "$RELEASE_COMMIT"
      - name: Test public SwiftPM URLs after publication
        if: inputs.publish
        # Draft assets require authentication, so public binary-target URL
        # resolution is only testable after publication. Use the committed
        # remote manifest and downloaded binaries for the direct-link checks.
        run: python3 scripts/test-artifacts.py --slices macos --dist "$RUNNER_TEMP/release-consumer/dist" --package "$GITHUB_WORKSPACE"
